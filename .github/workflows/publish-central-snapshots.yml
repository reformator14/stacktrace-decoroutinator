name: Publish Maven Central Snapshots

on:
#  push:
#    branches:
#      - master
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '8'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Import PGP key
        run: echo "${{ secrets.PGP_PRIVATE_KEY }}" | gpg --batch --yes --import

      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish
        run: ./gradlew -Dorg.gradle.jvmargs="-Xmx2g" -Psonatype.username=${{ secrets.SONATYPE_USERNAME }} -Psonatype.password=${{ secrets.SONATYPE_PASSWORD }} publishAggregationToCentralSnapshots
