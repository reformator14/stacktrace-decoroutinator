name: Run Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    env:
      GRADLE_OPTS: -Xmx2g
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create AVD 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: arm64-v8a
          target: google_apis_playstore
          force-avd-creation: false
          emulator-options: -no-window -gpu off -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: echo "AVD 35 created"

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '8'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize test build's Gradle wrapper
        run: ./gradlew initTestsGradleWrapper

      - name: Setup local.properties in test build
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > _tests/local.properties
#
#      - name: Run root build's tests
#        run: ./gradlew test
#
#      - name: Run test build's tests
#        working-directory: _tests
#        run: ../gradlew test

      - name: Run test build's Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: arm64-v8a
          target: google_apis_playstore
          force-avd-creation: false
          emulator-options: -no-window -gpu off -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: cd _tests && ../gradlew connectedAndroidTest
