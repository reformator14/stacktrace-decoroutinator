name: Run Tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Xmx2g
    steps:
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '8'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize test build's Gradle wrapper
        run: ./gradlew initTestsGradleWrapper

      - name: Run root build's tests
        run: ./gradlew test

      - name: Run test build's tests
        working-directory: _tests
        run: ../gradlew test

      - name: Run test build's Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          disable-animations: true
          script: |
            cd _tests
            ../gradlew connectedAndroidTest
