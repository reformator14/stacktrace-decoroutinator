# The Kotlin Gradle plugin adds kotlin-stdlib as an implicit dependency by default - this module
# must NOT have kotlin-stdlib anywhere on its own dependency graph (that's the whole point of it:
# see NoKotlinStdlibTest's class doc), so that default is switched off here specifically. provider
# and runtime-settings rely on the (root-level) default staying on, so this is deliberately scoped
# to just this module rather than changed at the root.
kotlin.stdlib.default.dependency=false
